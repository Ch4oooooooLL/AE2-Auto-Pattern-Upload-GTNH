name: Release tagged build

# 推送 v* 形式的版本 tag（例如 v1.2）时自动构建，并把 jar 挂到 GitHub Release 上。
# Release 的更新日志取自 docs/CHANGELOG.md 中与 tag 同名的小节（见该文件说明）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      # GTNHGradle 直接用该值作为 mod 版本，避免出现 +<commit>-dirty 之类的后缀。
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 版本号来自 git tag，必须取完整历史。
          fetch-depth: 0

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: |
            8
            17
            21

      - name: Use Java 21 for the Gradle daemon
        run: |
          set -euo pipefail
          if [ -z "${JAVA_HOME_21_X64:-}" ]; then
            echo "JAVA_HOME_21_X64 未设置，setup-java 可能改了行为" >&2
            exit 1
          fi
          echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          set -euo pipefail
          # gradlew 在 git 中没有可执行位时会以 126 退出，这里兜一下。
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Collect release jars
        id: jars
        run: |
          set -euo pipefail
          files=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-dev.jar' | sort | tr '\n' ' ')
          if [ -z "${files// /}" ]; then
            echo "No release jar was produced" >&2
            exit 1
          fi
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "Will upload: ${files}"

      - name: Extract release notes
        id: notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          short="${tag#v}"
          notes_file="build/release-notes.md"
          if [ -f docs/CHANGELOG.md ]; then
            # 取 "## <tag>" 这一节直到下一个二级标题
            awk -v tag="${tag}" -v ver="${short}" '
              /^##[ \t]/ {
                heading = $0
                sub(/^##[ \t]+/, "", heading)
                gsub(/\[/, "", heading)
                gsub(/\]/, "", heading)
                gsub(/\t/, " ", heading)
                split(heading, parts, " ")
                printing = (parts[1] == tag || parts[1] == ver)
                next
              }
              printing { print }
            ' docs/CHANGELOG.md > "${notes_file}"
          fi
          if [ -s "${notes_file}" ]; then
            echo "notes_file=${notes_file}" >> "$GITHUB_OUTPUT"
            echo "使用 docs/CHANGELOG.md 中 ${tag} 的条目作为更新日志"
          else
            echo "docs/CHANGELOG.md 中没有 ${tag} 的条目，回退到自动生成的 release notes" >&2
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *-pre|*-snapshot) prerelease="--prerelease" ;;
          esac
          notes="--generate-notes"
          notes_file="${{ steps.notes.outputs.notes_file }}"
          if [ -n "${notes_file}" ]; then
            notes="--notes-file ${notes_file}"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            ${notes} \
            ${prerelease} \
            ${{ steps.jars.outputs.files }}
