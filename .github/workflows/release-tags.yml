name: Release tagged build

# 推送 v* 形式的版本 tag（例如 v1.1.3）时自动构建，并把 jar 挂到 GitHub Release 上。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      # GTNHGradle 直接用该值作为 mod 版本，避免出现 +<commit>-dirty 之类的后缀。
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 版本号来自 git tag，必须取完整历史。
          fetch-depth: 0

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            17
            21

      - name: Use Java 21 for the Gradle daemon
        run: echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Collect release jars
        id: jars
        run: |
          set -euo pipefail
          files=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-dev.jar' | sort | tr '\n' ' ')
          if [ -z "${files// /}" ]; then
            echo "No release jar was produced" >&2
            exit 1
          fi
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "Will upload: ${files}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *-pre|*-snapshot) prerelease="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease} \
            ${{ steps.jars.outputs.files }}
